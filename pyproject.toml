[project]
name = "rococo-evaluation-lib"
version = "0.1.0"
description = "Evaluation procedure for a face recognition system"
authors = [
    {name = "mgarbowski", email = "mikolaj.garbowski@gmail.com"},
]
dependencies = []
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
test = {env = {PYTHONPATH = "src"}, cmd = "pytest tests/"}

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
