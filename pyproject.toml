[project]
name = "rococo-evaluation-lib"
version = "0.1.2"
description = "Evaluation procedure for a face recognition system"
authors = [{ name = "mgarbowski", email = "mikolaj.garbowski@gmail.com" }]
dependencies = ["numpy>=1.24.4", "opencv-python>=4.8.1.78"]
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
